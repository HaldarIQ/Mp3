<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HaiMusic</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            --bg-elevation: rgba(255, 255, 255, 0.05);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --accent-primary: #4F46E5;
            --accent-secondary: #4338CA;
            --text-primary: #FFFFFF;
            --text-secondary: #d1c4e9;
            --text-tertiary: #a0aec0;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --font-main: 'Poppins', sans-serif;
            --transition-curve: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-duration: 0.4s;
            --bezel-color: #080808;
            --color-success: #34D399;
            --color-error: #F87171;
            --color-warning: #FBBF24;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: var(--font-main); background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mobile-frame {
            position: relative;
            /* Vertical Mobile UI Sizing */
            width: 100%;
            height: 100%;
            max-width: 414px;
            max-height: 896px;

            background: var(--bg-gradient);
            border-radius: 40px; 
            box-shadow: 0 10px 40px var(--shadow-color);
            display: flex; flex-direction: column; overflow: hidden;
            border: 8px solid var(--bezel-color); color: var(--text-primary);
            transition: filter 0.2s ease-in-out;
        }
        
        .blob-container { min-height: 100%; overflow: hidden; position: absolute; width: 100%; top: 0; left: 0; filter: blur(40px); z-index: 0; }
        .blob { background: #4F46E5; height: 250px; width: 350px; border-radius: 40% 60% 60% 40% / 70% 30% 70% 30%; position: absolute; left: 10%; top: 5%; animation: move-blob 15s infinite alternate; }
        .blob.one{ top: 20vh; left: 60%; background: #4338CA; animation-duration: 12s; }
        .blob.two{ top: 70vh; left: 15%; background: #A78BFA; animation-duration: 10s; }
        .blob.three{ top: 50vh; left: 80%; background: #A78BFA; animation-duration: 8s; height: 150px; width: 200px;}
        @keyframes move-blob { from { transform: rotate(0deg) scale(1.2) skew(1deg) } to { transform: rotate(350deg) scale(0.8) skew(-5deg) } }

        .app-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; visibility: hidden; transition: opacity 0.3s var(--transition-curve), visibility 0s 0.3s; }
        .app-overlay.visible { opacity: 1; visibility: visible; transition: opacity 0.3s var(--transition-curve); }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid var(--text-tertiary); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-content { flex-grow: 1; overflow-y: auto; z-index: 1; padding: 20px 25px 120px 25px; scrollbar-width: none; -ms-overflow-style: none; }
        .main-content::-webkit-scrollbar { display: none; }
        .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .main-header h1 { font-size: 24px; font-weight: 700; margin: 0; }
        .main-header button { background: none; border: none; font-size: 20px; color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
        .search-bar { position: relative; margin-bottom: 25px; }
        .search-bar input { width: 100%; background: var(--bg-elevation); border: 1px solid var(--glass-border); border-radius: 8px; padding: 12px 15px 12px 40px; color: var(--text-primary); font-family: inherit; font-size: 14px; }
        .search-bar i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: var(--text-secondary); }
        .section-title { margin: 30px 0 15px; font-size: 18px; font-weight: 600; }
        .horizontal-scroll-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .horizontal-scroll-container::-webkit-scrollbar { display: none; }
        .song-art-container { position: relative; flex-shrink: 0; }
        .song-card { width: 140px; flex-shrink: 0; cursor: pointer; }
        .song-card .song-art-container img { width: 100%; height: 140px; border-radius: 8px; object-fit: cover; background-color: var(--bg-elevation); }
        .song-card h4 { font-size: 14px; font-weight: 500; margin: 10px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-card p { font-size: 12px; margin: 0; color: var(--text-secondary); }
        .song-list-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; }
        .song-list-item.active { background-color: rgba(79, 70, 229, 0.25); }
        .song-list-item:hover { background-color: var(--bg-elevation); }
        .song-list-item .song-art-container img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .song-list-item-info { flex-grow: 1; overflow: hidden; }
        .song-list-item-info h4 { margin: 0 0 4px; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-list-item-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }
        .sound-indicator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); border-radius: inherit; display: flex; justify-content: center; align-items: center; gap: 3px; display: none; }
        .sound-indicator span { width: 4px; height: 40%; background-color: var(--accent-primary); border-radius: 2px; animation: waveAnimation 1.2s ease-in-out infinite; }
        .sound-indicator span:nth-child(2) { animation-delay: -1.0s; } .sound-indicator span:nth-child(3) { animation-delay: -0.8s; } .sound-indicator span:nth-child(4) { animation-delay: -0.6s; }
        @keyframes waveAnimation { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1.0); } }
        .mini-player { position: absolute; bottom: 15px; left: 15px; right: 15px; background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 12px; display: flex; align-items: center; padding: 10px; z-index: 50; cursor: pointer; transform: translateY(150%); transition: transform var(--transition-duration) var(--transition-curve); }
        .mini-player.visible { transform: translateY(0); }
        .mini-player-progress { position: absolute; bottom: 0; left: 0; width: 0%; height: 2px; background: var(--accent-primary); border-radius: 0 0 0 12px; transition: width 0.1s linear; }
        .mini-player img { width: 45px; height: 45px; border-radius: 6px; }
        .mini-player-info { flex-grow: 1; margin: 0 12px; overflow: hidden; }
        .mini-player-info h4 { margin: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-player-info p { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
        .mini-player-controls button { background: none; border: none; font-size: 24px; color: var(--text-secondary); margin-left: 12px; padding: 5px; }
        .player-overlay { flex-direction: column; justify-content: space-between; background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 20px 30px; transform: translateY(100%); transition: transform var(--transition-duration) var(--transition-curve); }
        .player-overlay.visible { transform: translateY(0); }
        .player-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .player-header button { background: none; border: none; font-size: 22px; color: var(--text-secondary); cursor: pointer; }
        .player-main { text-align: center; width: 100%; }
        .player-main .album-art { width: 100%; max-width: 300px; aspect-ratio: 1/1; margin: 25px auto; border-radius: 12px; background-size: cover; background-position: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .player-track-info { margin-bottom: 25px; }
        .player-track-info h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
        .player-track-info p { margin: 0; color: var(--text-secondary); }
        .player-progress { width: 100%; margin: 15px 0 10px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer;}
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--text-primary); cursor: pointer; margin-top: -6px; transition: transform 0.2s; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
        .player-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 15px 0; }
        .player-controls button { background: none; border: none; color: var(--text-secondary); font-size: 22px; cursor: pointer; transition: color 0.2s, transform 0.2s; }
        .player-controls button.active { color: var(--accent-primary); }
        #player-play-pause-btn { font-size: 36px; width: 70px; height: 70px; background: var(--accent-primary); border-radius: 50%; color: var(--text-primary); display:flex; align-items:center; justify-content:center; }
        .settings-content { background: #19163a; width: 90%; max-width: 380px; border-radius: 15px; padding: 25px; border: 1px solid var(--glass-border); max-height: 90vh; overflow-y: auto; }
        .settings-content h2 { font-size: 22px; font-weight: 600; margin: 0 0 20px; text-align: center; }
        .settings-content h3 { font-size: 18px; font-weight: 600; margin: 30px 0 15px; border-top: 1px solid var(--glass-border); padding-top: 25px;}
        .source-item { display:flex; justify-content:space-between; align-items:center; padding: 12px 5px; font-size: 14px; border-bottom: 1px solid var(--glass-border); }
        .source-item span { font-size: 12px; opacity: 0.7; }
        .source-item button { background:none; border:none; color: #ff7b7b; cursor:pointer; font-size: 16px; }
        .source-input-container { display: flex; gap: 10px; margin-top: 20px; }
        .source-input-container input { flex-grow: 1; background: var(--bg-elevation); border: 1px solid var(--glass-border); border-radius: 6px; padding: 10px; color: var(--text-primary); }
        .source-input-container button { background: var(--accent-primary); border: none; color: white; padding: 0 15px; border-radius: 6px; cursor: pointer; font-size: 16px; min-width: 44px; }
        #close-settings-btn { width:100%; margin-top: 25px; padding: 12px; background: var(--bg-elevation); border:none; color: var(--text-primary); border-radius: 8px; font-weight: 500; }
        
        .control-center { display: flex; justify-content: center; gap: 24px; margin-top: 15px; }
        .slider-module, .slider-module-video { width: 70px; height: 220px; background-color: rgba(10, 10, 10, 0.4); border-radius: 35px; position: relative; overflow: hidden; display: flex; flex-direction: column-reverse; align-items: center; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5); }
        .slider-fill, .slider-fill-video { position: absolute; bottom: 0; left: 0; width: 100%; background-image: linear-gradient(to top, #f0f0f0, #ffffff); pointer-events: none; border-radius: 35px; box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3); }
        .slider-fill::after, .slider-fill-video::after { content: ''; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 30px; height: 5px; background-color: rgba(0, 0, 0, 0.2); border-radius: 3px; border: 1px solid rgba(255, 255, 255, 0.3); }
        input[type="range"].vertical-slider, input[type="range"].vertical-slider-video { -webkit-appearance: none; appearance: none; height: 70px; background: transparent; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); cursor: pointer; z-index: 10; width: 220px; }
        input[type="range"].vertical-slider::-webkit-slider-thumb, input[type="range"].vertical-slider-video::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1px; height: 1px; background: transparent; }
        .slider-icon, .slider-icon-video { position: absolute; bottom: 20px; z-index: 5; pointer-events: none; transition: filter 0.3s ease; }
        .slider-icon svg, .slider-icon-video svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
        #brightness-module .slider-icon svg, #video-brightness-icon svg { fill: #FFA500; }
        #volume-module .slider-icon svg, #video-volume-icon svg { fill: #007AFF; }
        .slider-module.active .slider-icon, .slider-module-video.active .slider-icon-video { filter: brightness(0) invert(1) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
        
        #video-controls-overlay { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); }
        .sliders-container { display: flex; gap: 24px; }
        .hidden { display: none !important; }

        #toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .toast { padding: 10px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; box-shadow: 0 4px 15px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: opacity 0.3s ease, transform 0.3s ease; }
        .toast.visible { opacity: 1; transform: translateY(0); }
        .toast.success { background-color: var(--color-success); }
        .toast.error { background-color: var(--color-error); }
        .toast.warning { background-color: var(--color-warning); color: #1f2937; }

        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px 20px; }
        .empty-state i { font-size: 18px; margin: 0 5px; }

        @keyframes like-pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
        .like-pop-animation { animation: like-pop 0.3s ease-in-out; }
        
        /* MODIFIED: Lyrics styles */
        .lyrics-content { background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); width: 90%; max-width: 380px; border-radius: 15px; padding: 20px; border: 1px solid var(--glass-border); height: 80vh; display: flex; flex-direction: column; }
        .lyrics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .lyrics-header h2 { margin: 0; font-size: 20px; }
        .lyrics-header button { background:none; border:none; font-size: 20px; color: var(--text-secondary); cursor:pointer; }
        #lyrics-text-container { flex-grow: 1; overflow-y: auto; text-align: center; line-height: 1.8; }
        #lyrics-text-container::-webkit-scrollbar { width: 4px; }
        #lyrics-text-container::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }
        #lyrics-text { white-space: pre-wrap; font-family: var(--font-main); font-size: 16px; color: var(--text-primary); }
        /* NEW: Lyrics Fallback styles */
        #lyrics-fallback { text-align: center; margin-top: 20px; }
        #lyrics-fallback p { font-size: 14px; color: var(--text-secondary); }
        #search-lyrics-btn { background: var(--accent-primary); border: none; color: white; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 10px; font-family: var(--font-main); font-weight: 500; transition: background-color 0.2s; }
        #search-lyrics-btn:hover { background-color: var(--accent-secondary); }

    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="blob-container">
            <div class="blob"></div><div class="blob one"></div><div class="blob two"></div><div class="blob three"></div>
        </div>

        <div id="loading-overlay" class="app-overlay visible"><div class="loading-spinner"></div></div>
        
        <div id="player-overlay" class="app-overlay player-overlay">
            <div class="player-header">
                <button id="close-player-btn" aria-label="Close player"><i class="fa-solid fa-chevron-down"></i></button>
                <div>
                    <button id="lyrics-btn" aria-label="Show lyrics"><i class="fa-solid fa-scroll"></i></button>
                    <button id="open-video-controls-btn" aria-label="Open video controls"><i class="fa-solid fa-sliders"></i></button>
                </div>
            </div>
            <div class="player-main">
                <div class="album-art" id="player-album-art"></div>
                <div class="player-track-info">
                    <h2 id="player-title">No song selected</h2>
                    <p id="player-artist">HaiMusic</p>
                </div>
            </div>
            <div class="player-controls-container">
                <div class="player-progress">
                    <input type="range" id="player-progress-bar" min="0" max="100" value="0" aria-label="Song progress">
                    <div class="time-stamps"><span id="player-current-time">0:00</span><span id="player-duration">0:00</span></div>
                </div>
                <div class="player-controls">
                     <button id="player-shuffle-btn" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
                     <button id="player-prev-btn" aria-label="Previous track"><i class="fa-solid fa-backward-step"></i></button>
                     <button id="player-play-pause-btn" aria-label="Play or pause"><i class="fa-solid fa-play"></i></button>
                     <button id="player-next-btn" aria-label="Next track"><i class="fa-solid fa-forward-step"></i></button>
                     <button id="player-repeat-btn" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
                </div>
                 <div style="text-align:center; margin-top: 15px;">
                      <button id="player-like-btn" style="font-size:20px; color: var(--text-secondary);" aria-label="Like song"><i class="fa-regular fa-heart"></i></button>
                 </div>
            </div>
        </div>
        
        <div id="settings-overlay" class="app-overlay">
            <div class="settings-content">
                <h2>Settings</h2>
                <h3>Display & Sound</h3>
                <div class="control-center">
                    <div class="slider-module" id="brightness-module">
                        <div class="slider-fill" id="brightness-fill"></div>
                        <input type="range" class="vertical-slider" id="brightness-slider" min="40" max="120" value="100" aria-label="Brightness">
                        <div class="slider-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12,8a4,4,0,1,1-4,4,4,4,0,0,1,4-4m0-2a6,6,0,1,0,6,6,6,6,0,0,0-6-6Zm0-4a1,1,0,0,0-1,1V5a1,1,0,0,0,2,0V3A1,1,0,0,0,12,2Zm0,20a1,1,0,0,0-1,1v2a1,1,0,0,0,2,0V21A1,1,0,0,0,12,22ZM5.64,4.22l-1.42,0a1,1,0,0,0-.7,1.71l1.41,1.41a1,1,0,0,0,1.42-1.42A1,1,0,0,0,5.64,4.22ZM18.36,19.78l1.42,0a1,1,0,0,0,.7-1.71l-1.41-1.41a1,1,0,0,0-1.42,1.42A1,1,0,0,0,18.36,19.78ZM19.78,5.64l0-1.42a1,1,0,0,0-1.71-.7L16.66,5a1,1,0,1,0,1.42,1.42A1,1,0,0,0,19.78,5.64ZM4.22,18.36l0,1.42a1,1,0,0,0,1.71.7l1.41-1.41a1,1,0,1,0-1.42-1.42A1,1,0,0,0,4.22,18.36ZM22,12a1,1,0,0,0-1-1H19a1,1,0,0,0,0,2h2A1,1,0,0,0,22,12ZM3,13H5a1,1,0,0,0,0-2H3a1,1,0,0,0,0,2Z"/></svg></div>
                    </div>
                    <div class="slider-module" id="volume-module">
                        <div class="slider-fill" id="volume-fill"></div>
                        <input type="range" class="vertical-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.75" aria-label="Volume">
                        <div class="slider-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.82,12a5.53,5.53,0,0,1-2.32,4.45,1,1,0,0,1-1-1.73,3.52,3.52,0,0,0,1.48-2.72,3.53,3.53,0,0,0-1.48-2.73,1,1,0,1,1,1-1.73A5.53,5.53,0,0,1,18.82,12ZM14,3.16a1,1,0,0,1,1.08.13,9.5,9.5,0,0,1,3.74,7.71,9.5,9.5,0,0,1-3.74,7.71,1,1,0,0,1-1.34-1.48,7.5,7.5,0,0,0,2.92-6.23,7.5,7.5,0,0,0-2.92-6.23,1,1,0,0,1,.26-1.61A1,1,0,0,1,14,3.16ZM11.4,2.27A1,1,0,0,0,10,2.11L4.29,6H2a1,1,0,0,0-1,1V17a1,1,0,0,0,1,1H4.29l5.71,3.89A1,1,0,0,0,11,22a1,1,0,0,0,1-1V3A1,1,0,0,0,11.4,2.27Z"/></svg></div>
                    </div>
                </div>
                <h3>Manage Sources</h3>
                <div id="source-list"></div>
                <div class="source-input-container">
                    <input type="text" id="source-url-input" placeholder="GitHub, .json, .m3u, or audio URL">
                    <button id="add-source-btn" aria-label="Add source"><i class="fa-solid fa-plus"></i></button>
                </div>
                <button id="close-settings-btn">Done</button>
            </div>
        </div>

        <div id="lyrics-overlay" class="app-overlay">
            <div class="lyrics-content">
                <div class="lyrics-header">
                    <h2>Lyrics</h2>
                    <button id="close-lyrics-btn" aria-label="Close lyrics"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <!-- MODIFIED: Lyrics Container -->
                <div id="lyrics-text-container">
                    <pre id="lyrics-text">Loading...</pre>
                    <!-- NEW: Lyrics Fallback UI -->
                    <div id="lyrics-fallback" class="hidden">
                        <p>Sorry, lyrics could not be found automatically.</p>
                        <button id="search-lyrics-btn">Search for Lyrics Online</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="video-controls-overlay" class="app-overlay" data-action="close">

('source-url-input'), addSourceBtn: document.getElementById('add-source-btn'),

        const defaultSources = [
            { type: 'github', url: 'https://api.github.com/repos/tzproapks/Mp3/contents/Bollywood/Item?ref=main', name: 'Bollywood' }, { type: 'github', url: 'https://api.github.com/repos/tzproapks/Mp3/contents/Tollywood/Item?ref=main', name: 'Tollywood' }, { type: 'github', url: 'https://api.github.com/repos/tzproapks/Mp3/contents/Bhakti?ref=main', name: 'Bhakti' }

        const showToast = (message, type = 'success', duration = 3000) => {

        const saveState = () => { if (typeof(Storage) !== "undefined") { const stateToSave = { sources: state.sources, likedSongs: state.likedSongs, recentlyPlayed: state.recentlyPlayed, currentTrackId: state.currentTrackId, currentTime: audioPlayer.currentTime, isShuffle: state.isShuffle, repeatMode: state.repeatMode, volume: audioPlayer.volume, brightness: dom.brightnessSlider.value, }; localStorage.setItem('haimusicState', JSON.stringify(stateToSave)); } };
        const loadState = () => { if (typeof(Storage) !== "undefined") { const savedState = JSON.parse(localStorage.getItem('haimusicState')); if (savedState) { state.sources = savedState.sources && savedState.sources.length > 0 ? savedState.sources : defaultSources; state.likedSongs = savedState.likedSongs || []; state.recentlyPlayed = savedState.recentlyPlayed || []; state.currentTrackId = savedState.currentTrackId || null; lastKnownTime = savedState.currentTime || 0; state.isShuffle = savedState.isShuffle || false; state.repeatMode = savedState.repeatMode || 'none'; setVolume(savedState.volume ?? 0.75); setBrightness(savedState.brightness ?? 100); } else { state.sources = defaultSources; } } };
        
        const setBrightness = (value) => { dom.mobileFrame.style.filter = `brightness(${value}%)`; const min = dom.brightnessSlider.min, max = dom.brightnessSlider.max; const percentage = ((value - min) / (max - min)) * 100; dom.brightnessSlider.value = value; dom.videoBrightnessSlider.value = value; dom.brightnessFill.style.height = `${percentage}%`; dom.videoBrightnessFill.style.height = `${percentage}%`; dom.brightnessModule.classList.toggle('active', percentage > 45); dom.videoBrightnessModule.classList.toggle('active', percentage > 45); };
        const setVolume = (value) => { audioPlayer.volume = value; const percentage = value * 100; dom.volumeSlider.value = value; dom.videoVolumeSlider.value = value; dom.volumeFill.style.height = `${percentage}%`; dom.videoVolumeFill.style.height = `${percentage}%`; dom.volumeModule.classList.toggle('active', percentage > 45); dom.videoVolumeModule.classList.toggle('active', percentage > 45); };
        
        const getAlbumArt = async (track) => { const defaultArt = `https://picsum.photos/seed/${encodeURIComponent(track.title)}/400`; if (!track.artist || !track.title) return defaultArt; try { const artist = encodeURIComponent(track.artist); const title = encodeURIComponent(track.title.split('(')[0].trim()); const response = await fetch(`https://www.theaudiodb.com/api/v1/json/2/search.php?s=${artist}&t=${title}`); if (!response.ok) return defaultArt; const data = await response.json(); if (data.track && data.track.length > 0 && data.track[0].strTrackThumb) { return data.track[0].strTrackThumb; } else { return defaultArt; } } catch (error) { console.error("Album art fetch failed:", error); return defaultArt; } };
        const parseTitleAndArtist = (filename, sourceName) => { let cleanedName = filename.replace(/\.(mp3|wav|ogg|flac|m4a)$/i, '').replace(/_/g, ' '); let title = cleanedName, artist = sourceName; const parts = cleanedName.split(' - '); if (parts.length > 1) { artist = parts[0].trim(); title = parts.slice(1).join(' - ').trim(); } return { title, artist }; };
        
        // MODIFIED: Lyrics Fetching Function
        const fetchLyrics = async (artist, title) => {
            if (!artist || !title) return "Lyrics not available (missing track info).";
            try {
                const response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
                const data = await response.json();
                if (response.ok && data.lyrics) {
                    return data.lyrics.replace(/(\r\n|\r|\n){2,}/g, '\n\n').trim();
                }
                return "Lyrics not available for this song.";
            } catch (error) {
                console.error("Lyrics fetch failed:", error);
                return "Could not retrieve lyrics. Please check your connection.";
            }
        };

        // MODIFIED: updateLyricsUI with Fallback
        const updateLyricsUI = async () => {
            const track = getCurrentTrack();
            if (!track) return;

            dom.lyricsText.textContent = 'Loading...';
            dom.lyricsFallback.classList.add('hidden');
            dom.lyricsText.classList.remove('hidden');

            const displayLyrics = (lyrics) => {
                if (lyrics) {
                    dom.lyricsText.textContent = lyrics;
                } else {
                    dom.lyricsText.classList.add('hidden');
                    dom.lyricsFallback.classList.remove('hidden');
                    const searchQuery = `${track.title} ${track.artist} lyrics`;
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;
                    
                    const newBtn = dom.searchLyricsBtn.cloneNode(true);
                    dom.searchLyricsBtn.parentNode.replaceChild(newBtn, dom.searchLyricsBtn);
                    dom.searchLyricsBtn = newBtn;
                    
                    dom.searchLyricsBtn.onclick = () => { window.open(searchUrl, '_blank'); };
                }
            };

            if (track.hasOwnProperty('lyrics')) {
                displayLyrics(track.lyrics);
                return;
            }

            const lyricsResult = await fetchLyrics(track.artist, track.title);
            if (lyricsResult.startsWith('Lyrics not available') || lyricsResult.startsWith('Could not retrieve')) {
                track.lyrics = null; // Cache failure
                displayLyrics(null);
            } else {
                track.lyrics = lyricsResult; // Cache success
                displayLyrics(lyricsResult);
            }
        };

        const getCurrentTrack = () => state.playlist.find(t => t.id === state.currentTrackId);
        const playTrack = () => { if (!state.currentTrackId) return; state.isPlaying = true; audioPlayer.play().catch(e => console.error("Playback failed.", e)); updateAllPlayerUIs(); updateActiveSongInLists(); };
        const pauseTrack = () => { state.isPlaying = false; audioPlayer.pause(); updateAllPlayerUIs(); updateActiveSongInLists(); };
        const loadTrack = (trackId, play = false) => {
            const track = state.playlist.find(t => t.id === trackId);
            if (!track) return;
            state.currentTrackId = trackId;
            audioPlayer.src = track.url;
            audioPlayer.currentTime = 0;
            addToRecentlyPlayed(track.id);
            updateAllPlayerUIs();
            updateActiveSongInLists();
            if (play) playTrack();
        };
        const nextTrack = () => { const currentIndex = state.playlist.findIndex(t => t.id === state.currentTrackId); if(state.playlist.length === 0 || currentIndex === -1) return; let newIndex; if (state.isShuffle) { newIndex = Math.floor(Math.random() * state.playlist.length); } else { newIndex = currentIndex + 1; } if (newIndex >= state.playlist.length) { if(state.repeatMode === 'all') newIndex = 0; else { pauseTrack(); return; } } loadTrack(state.playlist[newIndex].id, true); };
        const prevTrack = () => { const currentIndex = state.playlist.findIndex(t => t.id === state.currentTrackId); if(state.playlist.length === 0 || currentIndex === -1) return; const newIndex = (currentIndex - 1 + state.playlist.length) % state.playlist.length; loadTrack(state.playlist[newIndex].id, true); };
        const renderListItem = (track) => `<div class="song-art-container"><img src="${track.albumArt}" alt="" loading="lazy"><div class="sound-indicator"><span></span><span></span><span></span><span></span></div></div><div class="song-list-item-info"><h4>${track.title}</h4><p>${track.artist}</p></div>`;
        const renderCardItem = (track) => `<div class="song-art-container"><img src="${track.albumArt}" alt="" loading="lazy"><div class="sound-indicator"><span></span><span></span><span></span><span></span></div></div><h4>${track.title}</h4><p>${track.artist}</p>`;
        const renderList = (container, songIds, card = false) => { container.innerHTML = ''; const section = container.parentElement; const songsToRender = songIds.map(id => state.playlist.find(p => p.id === id)).filter(Boolean); if (songsToRender.length === 0) { if(section) section.classList.add('hidden'); return; } if(section) section.classList.remove('hidden'); songsToRender.forEach(track => { const item = document.createElement('div'); item.className = card ? 'song-card' : 'song-list-item'; item.dataset.songId = track.id; item.innerHTML = card ? renderCardItem(track) : renderListItem(track); item.addEventListener('click', () => loadTrack(track.id, true)); container.appendChild(item); }); };
        const renderAllSongs = (filter = '') => {
            dom.allSongsList.innerHTML = '';
            const lowerCaseFilter = filter.toLowerCase();
            const filteredPlaylist = state.playlist.filter(t => t.title.toLowerCase().includes(lowerCaseFilter) || t.artist.toLowerCase().includes(lowerCaseFilter));
            if (state.playlist.length === 0) {
                dom.allSongsList.innerHTML = `<div class="empty-state"><p>Your library is empty.</p><p>Go to <i class="fa-solid fa-gear"></i> Settings to add a music source.</p></div>`;
            } else if (filteredPlaylist.length === 0) {
                dom.allSongsList.innerHTML = `<p class="empty-state">No songs match "${filter}".</p>`;
            } else {
                filteredPlaylist.forEach(track => {
                    const item = document.createElement('div');
                    item.className = 'song-list-item';
                    item.dataset.songId = track.id;
                    item.innerHTML = renderListItem(track);
                    item.addEventListener('click', () => loadTrack(track.id, true));
                    dom.allSongsList.appendChild(item);
                });
            }
            updateActiveSongInLists();
        };
        const updateAllPlayerUIs = () => { const track = getCurrentTrack(); if (!track) { dom.miniPlayer.classList.remove('visible'); return; } dom.miniPlayer.classList.add('visible'); dom.miniPlayerTitle.textContent = track.title; dom.playerTitle.textContent = track.title; dom.miniPlayerArtist.textContent = track.artist; dom.playerArtist.textContent = track.artist; dom.miniPlayerArt.src = track.albumArt; dom.playerAlbumArt.style.backgroundImage = `url(${track.albumArt})`; const playIcon = state.isPlaying ? 'fa-pause' : 'fa-play'; dom.miniPlayerPlayPauseBtn.innerHTML = `<i class="fa-solid ${playIcon}"></i>`; dom.playerPlayPauseBtn.innerHTML = `<i class="fa-solid ${playIcon}"></i>`; const isLiked = state.likedSongs.includes(track.id); dom.playerLikeBtn.innerHTML = `<i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>`; dom.playerLikeBtn.classList.toggle('active', isLiked); dom.playerShuffleBtn.classList.toggle('active', state.isShuffle); dom.playerRepeatBtn.classList.toggle('active', state.repeatMode !== 'none'); dom.playerRepeatBtn.innerHTML = `<i class="fa-solid ${state.repeatMode === 'one' ? 'fa-1' : 'fa-repeat'}"></i>`; };
        const formatTime = (s) => { if (isNaN(s)) return "0:00"; const secs = Math.floor(s); const minutes = Math.floor(secs / 60); const seconds = secs % 60; return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`; };
        const updateProgress = () => { if (isNaN(audioPlayer.duration) || audioPlayer.duration <= 0) return; const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100; dom.playerProgressBar.value = progressPercent; dom.miniPlayerProgress.style.width = `${progressPercent}%`; dom.playerCurrentTime.textContent = formatTime(audioPlayer.currentTime); dom.playerDuration.textContent = formatTime(audioPlayer.duration); };
        const updateActiveSongInLists = () => { document.querySelectorAll('[data-song-id]').forEach(item => { const isCurrentAndPlaying = item.dataset.songId === state.currentTrackId; item.classList.toggle('active', isCurrentAndPlaying); const indicator = item.querySelector('.sound-indicator'); if (indicator) indicator.style.display = isCurrentAndPlaying && state.isPlaying ? 'flex' : 'none'; }); };
        const addToRecentlyPlayed = (id) => { state.recentlyPlayed = state.recentlyPlayed.filter(i => i !== id); state.recentlyPlayed.unshift(id); if(state.recentlyPlayed.length > 15) state.recentlyPlayed.pop(); renderList(dom.recentList, state.recentlyPlayed, true); };
        const toggleLike = () => {
            const track = getCurrentTrack();
            if (!track) return;
            const index = state.likedSongs.indexOf(track.id);
            if (index > -1) {
                state.likedSongs.splice(index, 1);
            } else {
                state.likedSongs.push(track.id);
                dom.playerLikeBtn.classList.add('like-pop-animation');
                dom.playerLikeBtn.addEventListener('animationend', () => {
                    dom.playerLikeBtn.classList.remove('like-pop-animation');
                }, { once: true });
            }
            updateAllPlayerUIs();
            renderList(dom.favouritesList, state.likedSongs, true);
        };
        const parseM3UContent = (text, source) => { const songs = []; const lines = text.split('\n'); let currentTrack = {}; for (const line of lines) { if (line.startsWith('#EXTINF:')) { const info = line.substring(8).split(','); currentTrack.title = (info[1] ? info[1].trim() : 'Untitled'); } else if (line.trim() && !line.startsWith('#')) { let url = line.trim(); if (!url.startsWith('http')) { try { url = new URL(url, source.url).href; } catch (e) { console.error("Invalid relative URL in M3U:", url); continue; } } const { title, artist } = parseTitleAndArtist(currentTrack.title || url.split('/').pop(), source.name); songs.push({ id: `m3u-${source.url}-${url}`, title, artist, url: url, albumArt: `https://picsum.photos/seed/${encodeURIComponent(title)}/400`, }); currentTrack = {}; } } return songs; };
        const fetchAllPlaylists = async (isInitialLoad = false) => {
            if (isInitialLoad) dom.loadingOverlay.classList.add('visible');
            const existingIds = new Set(state.playlist.map(t => t.id));
            let newSongs = [];
            for (const source of state.sources) {
                let songsFromSource = [];
                try {
                    const response = await fetch(source.url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    if (source.type === 'github') {
                        const data = await response.json();
                        const artFile = data.find(f => /\.(jpg|jpeg|png|gif)$/i.test(f.name));
                        const albumArt = artFile ? artFile.download_url : `https://picsum.photos/seed/${encodeURIComponent(source.name)}/400`;
                        songsFromSource = data.filter(f => f.name && f.name.endsWith('.mp3')).map(f => { const { title, artist } = parseTitleAndArtist(f.name, source.name); return { id: `gh-${f.sha}`, title, artist, url: f.download_url, albumArt }; });
                    } else if (source.type === 'json') {
                        const data = await response.json();
                        songsFromSource = data.map((s, i) => ({ id: `json-${source.url}-${i}`, title: s.title || 'Untitled', artist: s.artist || source.name, url: s.url, albumArt: s.albumArt || `https://picsum.photos/seed/default-${i}/400`}));
                    } else if (source.type === 'm3u') {
                        const text = await response.text();
                        songsFromSource = parseM3UContent(text, source);
                    } else if (source.type === 'direct') {
                        const { title, artist } = parseTitleAndArtist(source.name, "Direct");
                        songsFromSource.push({ id: `direct-${source.url}`, title, artist, url: source.url, albumArt: `https://picsum.photos/seed/${encodeURIComponent(title)}/400` });
                    }

                } catch(err) {
                    console.error(`Failed to fetch source: ${source.name}`, err);
                    if (!isInitialLoad) showToast(`Failed to load source: ${source.name}`, 'error');
                }
                songsFromSource.forEach(song => { if (!existingIds.has(song.id)) { newSongs.push(song); existingIds.add(song.id); } });
            }
            if (newSongs.length > 0) {
                state.playlist.push(...newSongs);
                if (!isInitialLoad) showToast(`${newSongs.length} new song(s) added!`);
                newSongs.forEach(async (song) => {
                    const artUrl = await getAlbumArt(song);
                    const trackInState = state.playlist.find(t => t.id === song.id);
                    if (trackInState) trackInState.albumArt = artUrl;
                    document.querySelectorAll(`[data-song-id='${song.id}'] img`).forEach(img => img.src = artUrl);
                    if (state.currentTrackId === song.id) { dom.miniPlayerArt.src = artUrl; dom.playerAlbumArt.style.backgroundImage = `url(${artUrl})`; }
                });
            }
            renderAllSongs(dom.searchInput.value);
            renderList(dom.favouritesList, state.likedSongs, true);
            renderList(dom.recentList, state.recentlyPlayed, true);
            if (isInitialLoad) dom.loadingOverlay.classList.remove('visible');
        };
        const parseSourceFromUrl = (url) => { const ghMatch = url.match(/github\.com\/([^/]+)\/([^/]+)\/(?:tree|blob)\/([^/]+)\/(.+)/); if (ghMatch) { const repo = `${ghMatch[1]}/${ghMatch[2]}`, path = ghMatch[4].replace(/\/$/, ''); return { type: 'github', url: `https://api.github.com/repos/${repo}/contents/${path}?ref=${ghMatch[3]}`, name: path.split('/').pop() || repo }; } if (url.endsWith('.json')) return { type: 'json', url, name: url.split('/').pop().replace('.json', '') }; if (url.endsWith('.m3u') || url.endsWith('.m3u8')) return { type: 'm3u', url, name: url.split('/').pop().replace(/\.m3u8?/, '') }; if (/\.(mp3|wav|ogg|flac|m4a)$/i.test(url)) return { type: 'direct', url, name: decodeURIComponent(url.split('/').pop()).replace(/\.[^/.]+$/, '') }; return null; };
        const addSource = async () => {
            const url = dom.sourceUrlInput.value.trim();
            if (!url) return;
            const newSource = parseSourceFromUrl(url);
            if (!newSource) {
                showToast("Invalid URL format.", 'error');
                return;
            }
            if (state.sources.some(s => s.url === newSource.url)) {
                showToast("This source has already been added.", 'warning');
                return;
            }

            dom.addSourceBtn.disabled = true;
            dom.addSourceBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

                state.sources.push(newSource);
                await fetchAllPlaylists();
                dom.sourceUrlInput.value = '';

            } catch (error) {
                showToast("An error occurred while adding the source.", 'error');
                state.sources = state.sources.filter(s => s.url !== newSource.url);

                dom.addSourceBtn.disabled = false;
                dom.addSourceBtn.innerHTML = `<i class="fa-solid fa-plus"></i>`;
            }
        };
        const renderSources = () => {
            dom.sourceList.innerHTML = '';
            if (state.sources.length === 0) {
                dom.sourceList.innerHTML = `<p style="text-align:center; font-size:14px; color: var(--text-secondary);">No sources added yet.</p>`;
                return;
            }
            state.sources.forEach((source, index) => {
                const item = document.createElement('div');
                item.className = 'source-item';
                item.innerHTML = `<div>${source.name} <span>(${source.type})</span></div><button data-index="${index}" aria-label="Delete source"><i class="fa-solid fa-trash"></i></button>`;
                item.querySelector('button').addEventListener('click', (e) => {
                    if (confirm(`Remove "${source.name}"? This will clear your current library and requires a refresh.`)) {
                        state.sources.splice(e.currentTarget.dataset.index, 1);
                        state.playlist = [];
                        fetchAllPlaylists(true);
                        renderSources();
                    }
                });

            });
        };

        const init = () => {
            dom.brightnessSlider.addEventListener('input', (e) => setBrightness(e.target.value)); dom.volumeSlider.addEventListener('input', (e) => setVolume(e.target.value)); dom.videoBrightnessSlider.addEventListener('input', (e) => setBrightness(e.target.value)); dom.videoVolumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
            dom.openVideoControlsBtn.addEventListener('click', () => dom.videoControlsOverlay.classList.add('visible')); dom.videoControlsOverlay.addEventListener('click', (e) => { if (e.target.dataset.action === 'close') dom.videoControlsOverlay.classList.remove('visible'); });
            dom.miniPlayer.addEventListener('click', (e) => { if (!e.target.closest('button')) dom.playerOverlay.classList.add('visible'); });
            dom.closePlayerBtn.addEventListener('click', () => dom.playerOverlay.classList.remove('visible'));
            dom.miniPlayerPlayPauseBtn.addEventListener('click', () => state.isPlaying ? pauseTrack() : playTrack());
            dom.playerPlayPauseBtn.addEventListener('click', () => state.isPlaying ? pauseTrack() : playTrack());
            dom.playerNextBtn.addEventListener('click', nextTrack); dom.playerPrevBtn.addEventListener('click', prevTrack); dom.playerLikeBtn.addEventListener('click', toggleLike);
            audioPlayer.addEventListener('timeupdate', updateProgress); audioPlayer.addEventListener('ended', () => { if (state.repeatMode === 'one') { loadTrack(state.currentTrackId, true); } else { nextTrack(); } });
            dom.playerProgressBar.addEventListener('input', function() { if (!isNaN(audioPlayer.duration)) audioPlayer.currentTime = (this.value / 100) * audioPlayer.duration; });
            dom.playerRepeatBtn.addEventListener('click', () => { state.repeatMode = state.repeatMode === 'none' ? 'all' : (state.repeatMode === 'all' ? 'one' : 'none'); updateAllPlayerUIs(); });
            dom.playerShuffleBtn.addEventListener('click', () => { state.isShuffle = !state.isShuffle; updateAllPlayerUIs(); });
            dom.searchInput.addEventListener('input', (e) => renderAllSongs(e.target.value));
            dom.openSettingsBtn.addEventListener('click', () => { renderSources(); dom.settingsOverlay.classList.add('visible'); });
            dom.closeSettingsBtn.addEventListener('click', () => dom.settingsOverlay.classList.remove('visible'));
            dom.addSourceBtn.addEventListener('click', addSource);
            dom.sourceUrlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addSource(); });
            // MODIFIED: Lyrics button fetches lyrics on demand
            dom.lyricsBtn.addEventListener('click', () => {
                updateLyricsUI();
                dom.lyricsOverlay.classList.add('visible');
            });
            dom.closeLyricsBtn.addEventListener('click', () => dom.lyricsOverlay.classList.remove('visible'));

            window.addEventListener('beforeunload', saveState);
            loadState(); fetchAllPlaylists(true);
        };

        init();
    });
    </script>
</body>
</html>
